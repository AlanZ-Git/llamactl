site_name: Llamactl Documentation
site_description: User documentation for Llamactl - A management tool for Llama.cpp instances
site_author: Llamactl Team
site_url: https://llamactl.org

repo_name: lordmathis/llamactl
repo_url: https://github.com/lordmathis/llamactl

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - 工作站部署（中文）: workstation-deployment.zh-CN.md
  - 客户端接入（中文）:
      - 接入与使用: client-integration.zh-CN.md
      - 有限控制与 N1: control-api.zh-CN.md
      - OpenAPI YAML: control-openapi.yaml
      - 资源观测: resources.md
      - 主人暂停与释放: resource-policy.md
      - 单配置测试: deployment-tests.md
      - N1 客户端与外部评测: evaluator-client.md
  - Installation: installation.md
  - Quick Start: quick-start.md
  - Configuration: configuration.md
  - Authentication: authentication.md
  - Managing Instances: managing-instances.md
  - Managing Models: managing-models.md
  - Custom Backends: custom-backends.md
  - API Reference: api-reference.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search
  - git-revision-date-localized
  - mike:
      version_selector: true
      css_dir: css
      javascript_dir: js
      canonical_version: null
  - neoteroi.mkdocsoad:
      use_pymdownx: true

hooks:
  - docs/readme_sync.py
  - docs/fix_line_endings.py

extra:
  version:
    provider: mike
    default: stable
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lordmathis/llamactl

extra_css:
- css/css-v1.1.3.css
